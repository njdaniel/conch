name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # schema-compat diffs against the merge base

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files -co --exclude-standard '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      # No tracked text file may hold a bidi control, a line or paragraph
      # separator, or a control character other than tab, LF and CR (#244).
      # The script's own test runs first.
      - name: invisible characters
        run: |
          ./scripts/invisible-chars-test.sh
          ./scripts/invisible-chars.sh

      - name: go vet
        run: go vet ./...

      # .golangci-lint-version is the one place the linter version is named;
      # `make lint` and the pre-commit hook refuse to run any other. The
      # release it names must be built with a Go >= the go directive in
      # go.mod (1.25). golangci-lint-action@v8 has no version-file input, so
      # the file is read here.
      - name: golangci-lint version
        id: lint-version
        run: |
          v=$(tr -d '[:space:]' < .golangci-lint-version)
          echo "version=v${v#v}" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ steps.lint-version.outputs.version }}
          # Off: `config verify` downloads a JSON schema, and the job failed
          # when that download failed (#143). This step still fails on an
          # unknown linter or config version, but not on a misspelled key:
          # run `golangci-lint config verify` after editing .golangci.yml.
          verify: false

      - name: go test
        # internal/server alone takes 7–10 minutes under -race on a runner,
        # past go test's default 10-minute timeout per package (#471);
        # making it faster is #472.
        run: go test -race -timeout 25m ./...

      - name: schema compatibility
        env:
          SCHEMA_COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/schema-compat.sh

      # The web client's wire types are generated from pkg/schema (#348): this
      # fails when web/src/schema/generated*.ts differ from what
      # `go generate ./pkg/schema` writes. Go only. The script's own test
      # runs first.
      - name: generated TypeScript wire types
        run: |
          ./scripts/schema-ts-check-test.sh
          ./scripts/schema-ts-check.sh

      # The emoji catalog (#953): the vendored third_party/unicode/emoji-test.txt
      # matches its pinned hash and scripts/emoji-update.sh refuses a mismatch.
      # Drift of the generated catalog fails in go test (cmd/emoji-gen).
      - name: emoji catalog
        run: ./scripts/emoji-update-test.sh

      - name: dependency gate
        run: ./scripts/depgate.sh

      # The deployment files in ops/deploy (#435): shellcheck, systemd-analyze
      # verify, and the backup, restore, upgrade and rollback scripts against
      # a real conchd. sqlite3 is a host prerequisite of those scripts; the
      # runner image has shellcheck and systemd-analyze, and with CI set the
      # test fails rather than skips when one is missing.
      - name: deployment scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3 shellcheck
          ./scripts/deploy-scripts-test.sh

      # The Rust voice client under voice/ (ADR-006). The toolchain script
      # fetches one pinned clang, cargo-deny and libwebrtc and verifies each
      # against the SHA-256 in scripts/voice-pins.sh, which is therefore the
      # cache key. rustup, already on the runner, installs the Rust version
      # voice/rust-toolchain.toml names.
      - name: rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/conch/llvm-*
            ~/.cache/conch/cargo-deny-*
            ~/.cache/conch/webrtc-*
          key: voice-toolchain-${{ runner.os }}-${{ hashFiles('scripts/voice-pins.sh') }}

      - name: rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            voice/target
          key: voice-build-${{ runner.os }}-${{ hashFiles('voice/Cargo.lock', 'voice/rust-toolchain.toml', 'scripts/voice-pins.sh') }}
          # After a dependency change, start from the last build instead of
          # from nothing; cargo rebuilds only what changed.
          restore-keys: |
            voice-build-${{ runner.os }}-

      # The SDK's build needs GLib's headers (found through pkg-config). So does
      # dmn-audio's: the PipeWire headers (also found through pkg-config) and
      # libclang, which generates the Rust bindings to them. Nothing else comes
      # from the system. scripts/voice-env.sh says so if any is missing.
      - name: rust system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev libpipewire-0.3-dev libclang-dev pkg-config

      - name: rust toolchain
        run: ./scripts/voice-toolchain.sh

      - name: rust check
        run: make rust-check

      # The web client under web/ (ADR-007). setup-node installs exactly the
      # Node web/.nvmrc pins and caches npm's download cache by the lockfile.
      # web-check installs with npm ci only, and downloads no browser.
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: web check
        run: make web-check

      # The desktop shell under desktop/ (#940): the fetch script's test, the
      # repository rules, the dependency and licence gates, then npm ci,
      # typecheck, lint and unit tests. It downloads no Electron binary and
      # needs no display; the packaged app is the desktop-smoke job's.
      # desktop/.nvmrc names the same Node as web/.nvmrc (make desktop-check
      # fails if the installed Node is not the one it names).
      - name: desktop check
        run: make desktop-check

  desktop-smoke:
    # The packaged desktop shell (#940): make desktop-build fetches the pinned
    # Electron (scripts/desktop-electron.sh checks its SHA-256 twice), builds
    # the web client for it and packs the unpacked Linux app with its fuses;
    # the smoke test then starts that app under a virtual display and drives it
    # over Chromium's remote-debugging port (desktop/tests/smoke/launch.ts says
    # why not Playwright's Electron launcher). It prints the app's
    # process.versions into this log. A job of its own: it needs a display and
    # a 100 MB download, and `make check` needs neither.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The REST smoke test (#942) builds a disposable conchd from this checkout.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      # The unpacked Electron, keyed by the pin file that names its version
      # and hash. Without a hit the build downloads it and checks it.
      - name: electron cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/conch/electron
          key: desktop-electron-${{ runner.os }}-${{ hashFiles('scripts/desktop-pins.sh') }}

      - name: virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # The browser build must not change because the desktop shell exists:
      # web/dist is hashed before and after the desktop build, and holds no
      # desktop code.
      - name: browser build before
        run: |
          make web-build
          ./scripts/desktop-web-dist-check.sh
          (cd web/dist && find . -type f | LC_ALL=C sort | xargs sha256sum) > "$RUNNER_TEMP/web-dist.before"

      - name: build the unpacked app
        run: make desktop-build

      - name: browser build after
        run: |
          (cd web/dist && find . -type f | LC_ALL=C sort | xargs sha256sum) > "$RUNNER_TEMP/web-dist.after"
          diff "$RUNNER_TEMP/web-dist.before" "$RUNNER_TEMP/web-dist.after"

      # The Chromium sandbox stays on. This runner's kernel may restrict
      # unprivileged user namespaces (Ubuntu 24.04's AppArmor), which the
      # sandbox's namespace mode needs; the setuid helper is the other mode,
      # and it is what the .deb package installs (#774). Here it is made so on
      # the throwaway runner. Not verified before this job's first CI run: if
      # the sandbox will not start, this step is where to look.
      - name: sandbox helper
        run: |
          sudo chown root:root desktop/dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 desktop/dist/linux-unpacked/chrome-sandbox

      - name: smoke test
        run: xvfb-run -a make desktop-smoke

  web-embedded:
    # The web client built into conchd (issue #347): make build-web-embedded
    # builds bin/conchd with -tags conchweb, and this job starts it with no
    # --web-dir and checks what an operator who downloaded a release binary
    # gets: /app/ with the security headers and no-store on the index, a
    # hashed asset as immutable, `conchd version` saying so, and --no-web
    # turning it off. The untagged build is what the check job tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build
        run: make build-web-embedded

      - name: version says embedded
        run: |
          bin/conchd version | tee /dev/stderr | grep -qx 'web: embedded'

      - name: serve /app/ from the binary
        run: |
          set -eu
          data=$(mktemp -d)
          log=$(mktemp)
          bin/conchd serve --data "$data" --listen 127.0.0.1:0 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          addr=""
          for _ in $(seq 1 50); do
            addr=$(sed -n 's/^conchd .* listening on \(127\.0\.0\.1:[0-9]*\) .*/\1/p' "$log")
            [ -n "$addr" ] && break
            sleep 0.2
          done
          [ -n "$addr" ] || { echo "conchd did not start"; cat "$log"; exit 1; }
          grep -qx 'conchd web: embedded' "$log"

          # headers <path> <status>: writes the response headers to $hdr.
          hdr=$(mktemp)
          check() { # path want-status header-regex...
            path=$1; want=$2; shift 2
            got=$(curl -s -o /dev/null -D "$hdr" -w '%{http_code}' "http://$addr$path")
            [ "$got" = "$want" ] || { echo "GET $path = $got, want $want"; exit 1; }
            for re in "$@"; do
              grep -iq "$re" "$hdr" || { echo "GET $path: no header matching $re"; cat "$hdr"; exit 1; }
            done
          }
          check /app/ 200 \
            "^content-security-policy: default-src 'self'" \
            '^cache-control: no-store' \
            '^x-content-type-options: nosniff' \
            '^referrer-policy: no-referrer'
          asset=$(ls internal/web/dist/assets | head -n 1)
          [ -n "$asset" ] || { echo "the build has no hashed asset"; exit 1; }
          check "/app/assets/$asset" 200 '^cache-control: public, max-age=31536000, immutable'
          check /app/assets/missing.js 404
          check / 302 '^location: /app/'

      - name: --no-web turns it off
        run: |
          set -eu
          data=$(mktemp -d)
          log=$(mktemp)
          bin/conchd serve --no-web --data "$data" --listen 127.0.0.1:0 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          addr=""
          for _ in $(seq 1 50); do
            addr=$(sed -n 's/^conchd .* listening on \(127\.0\.0\.1:[0-9]*\) .*/\1/p' "$log")
            [ -n "$addr" ] && break
            sleep 0.2
          done
          [ -n "$addr" ] || { echo "conchd did not start"; cat "$log"; exit 1; }
          # Authentication is on, so a route that does not exist answers 401
          # (nothing is exempt); what matters is that it is not 200 or 302.
          for p in /app/ /; do
            got=$(curl -s -o /dev/null -w '%{http_code}' "http://$addr$p")
            case "$got" in 200|301|302) echo "GET $p = $got with --no-web"; exit 1;; esac
          done

  rust-advisories:
    # Known advisories against the crates conch-voice links (RustSec). A job of
    # its own and not part of check: it reads a database on the network, and a
    # new advisory turns it red with no change here. Red means look at it, and
    # either update the crate or record why not in voice/deny.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: advisories
        run: ./scripts/voice-advisories.sh

  web-advisories:
    # Known advisories (high or critical) against the packages web/dist ships:
    # the runtime dependencies, so development tools are left out. A job of
    # its own and not part of check, as rust-advisories is: it reads the npm
    # registry's database, and a new advisory turns it red with no change
    # here. Red means look at it, and update the package or say why not.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - name: advisories
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  dogfood-check:
    # The P1 release canary (ROADMAP success criterion,
    # .claude/skills/dogfood-check/): runs on every push to main and on any
    # PR labeled approval-path, per issue #19's acceptance criteria; the
    # release workflow (release.yml) runs it again on every tag. A release
    # does not ship, and an approval-path PR does not merge, on a failing
    # dogfood-check.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'approval-path')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: dogfood-check
        run: go run ./e2e/dogfood

  nets-check:
    # The V2 exit proof (issue #121): the 2x4 squad layout through real
    # conchd/conch binaries, asserting the exact set of message ids every
    # participant sees on each message read path the server has (MCP
    # read_channel; the REST v2, v1 and v0 lists; the v2, v1 and v0
    # WebSockets; conch tail). Unlike dogfood-check it runs on every pull
    # request and every push to main, because any server change can open a
    # read path that leaks a scoped message. A new read path must be added to
    # the program: it cannot find one it does not know about.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: nets-check
        run: go run ./e2e/nets

  conch-bot-check:
    # conch-adapter against a real conchd, answering with the fixture
    # e2e/p3-local/fixtures/echo.sh (never a model): the reply loop in every
    # audience, the adapter's session and one run per reply seen through the
    # API, a clean stop that ends the session and releases the lock, and the old
    # name conch-bot still starting with one deprecation line. It runs on every
    # pull request and every push to main: the adapter and the session, run and
    # intervention tools it calls move together.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: conch-bot-check
        run: go run ./e2e/conch-bot

  p2-hardening-check:
    # The P2 exit gate (issue #81): a database written by a P1 conchd is
    # upgraded, and real conchd/conch binaries are driven through everything
    # P2 added on it: credentials, manifests and their refusals, rate limits,
    # the approval chain with ntfy up and down, the channel list (in the real
    # TUI too), audit export, search, files, threads and the principal-review
    # post. It ends by running e2e/dogfood itself and by checking it left
    # nothing behind. Like nets-check it runs on every pull request and every
    # push to main: what it guards is spread over the whole server and both
    # clients, so there is no set of paths or labels that could safely skip it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: p2-hardening-check
        run: go run ./e2e/p2-hardening

  p3-local-check:
    # The automated P3 suite (issues #283 and #284): builds conchd, conch and
    # conch-adapter and the web client, starts a disposable conchd with
    # --session-stale 2s --session-offline 5s, creates the test community and
    # reads it back through the API, checks that each participant can connect
    # and send, and then runs the thirteen rows of the brief's test table
    # (P3-01 to P3-13): two terminal clients on pseudo-terminals, the
    # scripted agents as real conch-adapter processes, and the API only to
    # look and to see the requests no client makes refused. It tears
    # everything down and fails if anything is left behind. Without --keep,
    # so nothing outlives the job; P3-13 runs only with --real-adapter and the
    # claude program on PATH, which this job has neither of, and is reported
    # as not run. It runs on every pull request and every push to main, and
    # release.yml runs it before it builds. Its own tests (reset, interrupts,
    # the HOME sentinel, the walkthrough's commands, the screen the terminal
    # driver reads) run in the check job's go test.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Labels the LiveKit container of the browser voice spec, so the clean-up
      # step below removes only this run's.
      VOICE_CHECK_RUN: web-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: p3-local
        run: go run ./e2e/p3-local

      # The same suite again with conchd bound to the runner's own private
      # IPv4 (eth0) and every client given that address, to catch an address
      # assumption in the server, the runner or the clients (issue #382). It
      # proves addressing, not another machine. The run refuses to start where
      # there is no such address, and never falls back to loopback.
      - name: p3-local, non-loopback
        run: go run ./e2e/p3-local --non-loopback

  web-e2e:
    # The browser suite (issue #285, D7): the web client in Chromium, against
    # the fixture community of e2e/p3-local (started with --keep and a
    # temporary root by the suite's own global setup, removed by its teardown,
    # which runs when a test fails too). Browser voice (issue #442) also runs
    # here: the spec starts the pinned LiveKit image in Docker, which the
    # runner has, on Chromium's fake microphone; with CI set it fails, not
    # skips, if Docker is missing. Playwright is pinned in
    # web/package.json and installs the Chromium that version needs. A job of
    # its own and not part of check, which needs no browser. It runs on every
    # pull request and every push to main. Scripted agents only: the claude
    # program is neither on this runner nor ever run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci --no-audit

      # --with-deps installs the system libraries Chromium needs, with sudo,
      # which the runner has. Locally, `npx playwright install chromium` alone.
      - name: browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: web-e2e
        run: make web-e2e

      # The spec removes its own container on every path; this is for the case
      # where the runner killed it. Only the container of this run.
      - name: remove any leftover LiveKit container
        if: always()
        run: docker ps -aq --filter "label=conch-web-voice=$VOICE_CHECK_RUN" | xargs -r docker rm -f

      # The traces hold this run's fixture credentials (Bearer headers, the
      # filled sign-in value). They are throwaway: `make web-e2e` runs the
      # global teardown, which stops the server and removes the root, before
      # this step, so by the time anyone downloads a trace they open nothing.
      - name: traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-test-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  voice-check:
    # The V3 exit program (issue #129, ADR-004): a real conchd, the real conch
    # CLI and a real LiveKit server in Docker, plus the proof that the core is
    # unaffected with LiveKit down or not configured. From V4 (issue #188) it
    # also runs three real conch-voice clients against them, so the job builds
    # the Rust client first. It runs on every pull request and every push to
    # main, like check. CI=true makes a skip a failure: if Docker, the LiveKit
    # image, lk or the Rust toolchain cannot be had, this job is red rather
    # than quietly green.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      # Labels this run's LiveKit container, so the clean-up step below can
      # only ever remove its own.
      VOICE_CHECK_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same pinned toolchain and build directory as the check job, read
      # from its caches and never written from here: check builds everything
      # this job needs (cargo test builds the conch-voice binary), so with a
      # warm cache the program's own `cargo build` has nothing left to do.
      - name: rust toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/conch/llvm-*
            ~/.cache/conch/cargo-deny-*
            ~/.cache/conch/webrtc-*
          key: voice-toolchain-${{ runner.os }}-${{ hashFiles('scripts/voice-pins.sh') }}

      - name: rust build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            voice/target
          key: voice-build-${{ runner.os }}-${{ hashFiles('voice/Cargo.lock', 'voice/rust-toolchain.toml', 'scripts/voice-pins.sh') }}
          restore-keys: |
            voice-build-${{ runner.os }}-

      - name: rust system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev libpipewire-0.3-dev libclang-dev pkg-config

      - name: rust toolchain
        run: ./scripts/voice-toolchain.sh

      - name: voice-check
        run: go run ./e2e/voice

      # The program removes its own container on every path; this is for the
      # case where the runner killed it. Only the container of this run.
      - name: remove any leftover LiveKit container
        if: always()
        run: docker ps -aq --filter "label=conch-voice-check=$VOICE_CHECK_RUN" | xargs -r docker rm -f

  isolation-check:
    # The private alpha's cross-group check (issue #447): two groups on one
    # conchd, a route-table-driven matrix proving a member of one reaches
    # nothing of the other over REST, the sockets and LiveKit's media (the
    # pinned image in Docker, the pinned lk), and a revoked tester's sockets
    # and LiveKit participant gone within their bounds. It runs on every pull
    # request and every push to main, like check. CI=true makes a skip a
    # failure: without Docker, the image or lk this job is red, not quietly
    # green. A run takes well under a minute once the image and lk are
    # fetched; the timeout leaves room for a slow pull.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Labels this run's LiveKit container, so the clean-up step below can
      # only ever remove its own.
      ISOLATION_CHECK_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: isolation-check
        run: go run ./e2e/isolation

      # The program removes its own container on every path; this is for the
      # case where the runner killed it. Only the container of this run.
      - name: remove any leftover LiveKit container
        if: always()
        run: docker ps -aq --filter "label=conch-isolation-check=$ISOLATION_CHECK_RUN" | xargs -r docker rm -f
