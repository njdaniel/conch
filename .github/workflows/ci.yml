          key: voice-toolchain-${{ runner.os }}-${{ hashFiles('scripts/voice-pins.sh') }}

      - name: rust build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            voice/target
          key: voice-build-lt-${{ runner.os }}-${{ hashFiles('voice/Cargo.lock', 'voice/rust-toolchain.toml', 'scripts/voice-pins.sh') }}
          restore-keys: |
            voice-build-lt-${{ runner.os }}-

      # The same apt cache as the rust job's, which this job, unlike its two
      # caches above, writes as well as reads: the jobs run side by side, and this is where a stalled
      # mirror cost 13 minutes (#1352). Whichever finishes first saves it.
      - name: rust system packages cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/conch-apt
          key: voice-apt-${{ runner.os }}-${{ hashFiles('scripts/ci-voice-apt.sh') }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}
          restore-keys: |
