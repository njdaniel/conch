name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # schema-compat diffs against the merge base

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files -co --exclude-standard '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      # No tracked text file may hold a bidi control, a line or paragraph
      # separator, or a control character other than tab, LF and CR (#244).
      # The script's own test runs first.
      - name: invisible characters
        run: |
          ./scripts/invisible-chars-test.sh
          ./scripts/invisible-chars.sh

      - name: go vet
        run: go vet ./...

      # .golangci-lint-version is the one place the linter version is named;
      # `make lint` and the pre-commit hook refuse to run any other. The
      # release it names must be built with a Go >= the go directive in
      # go.mod (1.25). golangci-lint-action@v8 has no version-file input, so
      # the file is read here.
      - name: golangci-lint version
        id: lint-version
        run: |
          v=$(tr -d '[:space:]' < .golangci-lint-version)
          echo "version=v${v#v}" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ steps.lint-version.outputs.version }}
          # Off: `config verify` downloads a JSON schema, and the job failed
          # when that download failed (#143). This step still fails on an
          # unknown linter or config version, but not on a misspelled key:
          # run `golangci-lint config verify` after editing .golangci.yml.
          verify: false

      - name: go test
        run: go test -race ./...

      - name: schema compatibility
        env:
          SCHEMA_COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/schema-compat.sh

      - name: dependency gate
        run: ./scripts/depgate.sh

      # The Rust voice client under voice/ (ADR-006). The toolchain script
      # fetches one pinned clang, cargo-deny and libwebrtc and verifies each
      # against the SHA-256 in scripts/voice-pins.sh, which is therefore the
      # cache key. rustup, already on the runner, installs the Rust version
      # voice/rust-toolchain.toml names.
      - name: rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/conch/llvm-*
            ~/.cache/conch/cargo-deny-*
            ~/.cache/conch/webrtc-*
          key: voice-toolchain-${{ runner.os }}-${{ hashFiles('scripts/voice-pins.sh') }}

      - name: rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            voice/target
          key: voice-build-${{ runner.os }}-${{ hashFiles('voice/Cargo.lock', 'voice/rust-toolchain.toml', 'scripts/voice-pins.sh') }}
          # After a dependency change, start from the last build instead of
          # from nothing; cargo rebuilds only what changed.
          restore-keys: |
            voice-build-${{ runner.os }}-

      # The SDK's build needs GLib's headers (found through pkg-config). So does
      # dmn-audio's: the PipeWire headers (also found through pkg-config) and
      # libclang, which generates the Rust bindings to them. Nothing else comes
      # from the system. scripts/voice-env.sh says so if any is missing.
      - name: rust system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev libpipewire-0.3-dev libclang-dev pkg-config

      - name: rust toolchain
        run: ./scripts/voice-toolchain.sh

      - name: rust check
        run: make rust-check

      # The web client under web/ (ADR-007). setup-node installs exactly the
      # Node web/.nvmrc pins and caches npm's download cache by the lockfile.
      # web-check installs with npm ci only, and downloads no browser.
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web check
        run: make web-check

  rust-advisories:
    # Known advisories against the crates conch-voice links (RustSec). A job of
    # its own and not part of check: it reads a database on the network, and a
    # new advisory turns it red with no change here. Red means look at it, and
    # either update the crate or record why not in voice/deny.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: advisories
        run: ./scripts/voice-advisories.sh

  web-advisories:
    # Known advisories (high or critical) against the packages web/dist ships:
    # the runtime dependencies, so development tools are left out. A job of
    # its own and not part of check, as rust-advisories is: it reads the npm
    # registry's database, and a new advisory turns it red with no change
    # here. Red means look at it, and update the package or say why not.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - name: advisories
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  dogfood-check:
    # The P1 release canary (ROADMAP success criterion,
    # .claude/skills/dogfood-check/): runs on every push to main and on any
    # PR labeled approval-path, per issue #19's acceptance criteria; the
    # release workflow (release.yml) runs it again on every tag. A release
    # does not ship, and an approval-path PR does not merge, on a failing
    # dogfood-check.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'approval-path')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: dogfood-check
        run: go run ./e2e/dogfood

  nets-check:
    # The V2 exit proof (issue #121): the 2x4 squad layout through real
    # conchd/conch binaries, asserting the exact set of message ids every
    # participant sees on each message read path the server has (MCP
    # read_channel; the REST v2, v1 and v0 lists; the v2, v1 and v0
    # WebSockets; conch tail). Unlike dogfood-check it runs on every pull
    # request and every push to main, because any server change can open a
    # read path that leaks a scoped message. A new read path must be added to
    # the program: it cannot find one it does not know about.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: nets-check
        run: go run ./e2e/nets

  conch-bot-check:
    # conch-adapter against a real conchd, answering with the fixture
    # e2e/p3-local/fixtures/echo.sh (never a model): the reply loop in every
    # audience, the adapter's session and one run per reply seen through the
    # API, a clean stop that ends the session and releases the lock, and the old
    # name conch-bot still starting with one deprecation line. It runs on every
    # pull request and every push to main: the adapter and the session, run and
    # intervention tools it calls move together.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: conch-bot-check
        run: go run ./e2e/conch-bot

  p2-hardening-check:
    # The P2 exit gate (issue #81): a database written by a P1 conchd is
    # upgraded, and real conchd/conch binaries are driven through everything
    # P2 added on it: credentials, manifests and their refusals, rate limits,
    # the approval chain with ntfy up and down, the channel list (in the real
    # TUI too), audit export, search, files, threads and the principal-review
    # post. It ends by running e2e/dogfood itself and by checking it left
    # nothing behind. Like nets-check it runs on every pull request and every
    # push to main: what it guards is spread over the whole server and both
    # clients, so there is no set of paths or labels that could safely skip it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: p2-hardening-check
        run: go run ./e2e/p2-hardening

  voice-check:
    # The V3 exit program (issue #129, ADR-004): a real conchd, the real conch
    # CLI and a real LiveKit server in Docker, plus the proof that the core is
    # unaffected with LiveKit down or not configured. From V4 (issue #188) it
    # also runs three real conch-voice clients against them, so the job builds
    # the Rust client first. It runs on every pull request and every push to
    # main, like check. CI=true makes a skip a failure: if Docker, the LiveKit
    # image, lk or the Rust toolchain cannot be had, this job is red rather
    # than quietly green.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      # Labels this run's LiveKit container, so the clean-up step below can
      # only ever remove its own.
      VOICE_CHECK_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same pinned toolchain and build directory as the check job, read
      # from its caches and never written from here: check builds everything
      # this job needs (cargo test builds the conch-voice binary), so with a
      # warm cache the program's own `cargo build` has nothing left to do.
      - name: rust toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/conch/llvm-*
            ~/.cache/conch/cargo-deny-*
            ~/.cache/conch/webrtc-*
          key: voice-toolchain-${{ runner.os }}-${{ hashFiles('scripts/voice-pins.sh') }}

      - name: rust build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            voice/target
          key: voice-build-${{ runner.os }}-${{ hashFiles('voice/Cargo.lock', 'voice/rust-toolchain.toml', 'scripts/voice-pins.sh') }}
          restore-keys: |
            voice-build-${{ runner.os }}-

      - name: rust system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev libpipewire-0.3-dev libclang-dev pkg-config

      - name: rust toolchain
        run: ./scripts/voice-toolchain.sh

      - name: voice-check
        run: go run ./e2e/voice

      # The program removes its own container on every path; this is for the
      # case where the runner killed it. Only the container of this run.
      - name: remove any leftover LiveKit container
        if: always()
        run: docker ps -aq --filter "label=conch-voice-check=$VOICE_CHECK_RUN" | xargs -r docker rm -f
