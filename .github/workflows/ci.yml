      # desktop/.nvmrc names the Node the desktop's tests run under. The
      # companion's test (#1583) also builds the web client (web-build) and
      # drives two Chromium pages, so web's lockfile is cached as well.
      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json

      # The screen companion's page and the browser principal V run in the
      # Chromium Playwright's own version pins (#1583). Locally, `npx
      # playwright install chromium` alone. The npm ci comes first so that npx
      # runs the Playwright desktop/package-lock.json pins, not whatever npx
      # would fetch; make desktop-voice-e2e then installs again, harmlessly.
      - name: browser for the companion test
        working-directory: desktop
        run: npm ci --no-audit && npx playwright install --with-deps chromium

      - name: desktop voice live test
        run: make desktop-voice-e2e

      # The program removes its own container on every path; this is for the
      # case where the runner killed it. Only the container of this run.
      - name: remove any leftover LiveKit container
        if: always()
        run: docker ps -aq --filter "label=conch-desktop-voice-check=$DESKTOP_VOICE_CHECK_RUN" | xargs -r docker rm -f

  isolation-check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The private alpha's cross-group check (issue #447): two groups on one
    # conchd, a route-table-driven matrix proving a member of one reaches
    # nothing of the other over REST, the sockets and LiveKit's media (the
    # pinned image in Docker, the pinned lk), and a revoked tester's sockets
    # and LiveKit participant gone within their bounds. It runs on every pull
    # request and every push to main, like check. CI=true makes a skip a
    # failure: without Docker, the image or lk this job is red, not quietly
    # green. A run takes well under a minute once the image and lk are
    # fetched; the timeout leaves room for a slow pull.
    # On GitHub-hosted runners (#1318): it builds no Rust and needs no disk.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Labels this run's LiveKit container, so the clean-up step below can
      # only ever remove its own.
      ISOLATION_CHECK_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: isolation-check
        run: go run ./e2e/isolation

      # The program removes its own container on every path; this is for the
      # case where the runner killed it. Only the container of this run.
      - name: remove any leftover LiveKit container
        if: always()
        run: docker ps -aq --filter "label=conch-isolation-check=$ISOLATION_CHECK_RUN" | xargs -r docker rm -f

  community-check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The community model's newcomer scenario (issue #989, ADR-013): the owner
    # makes a member link; alice opens the bare address, redeems it, reads
    # #general's full history, finds #project once it is public, joins it and
    # its voice; her voice is switched off and she is out of LiveKit's room
    # within the design's bound, and on again she rejoins; the closed link no
    # longer redeems; the server admits no guest. A real conchd and the pinned
    # LiveKit (Docker) and lk; the API and media-control path only, not the
    # browser. It runs on every pull request and every push to main, like
    # check. CI=true makes a skip a failure: without Docker, the image or lk
    # this job is red, not quietly green.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Labels this run's LiveKit container, so the clean-up step below can
      # only ever remove its own.
      COMMUNITY_CHECK_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: community-check
        run: go run ./e2e/community

      # The program removes its own container on every path; this is for the
      # case where the runner killed it. Only the container of this run.
      - name: remove any leftover LiveKit container
        if: always()
        run: docker ps -aq --filter "label=conch-community-check=$COMMUNITY_CHECK_RUN" | xargs -r docker rm -f
