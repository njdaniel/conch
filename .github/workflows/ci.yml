name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per pull request and one per main at a time (#1305): a superseded
# run should not hold runners (the self-hosted ones especially, when used).
# A new push to a pull request cancels its older run. (So does re-running an
# older run of the same pull request: re-run the newest instead.) On main a
# run is never cancelled mid-way; while one runs, one pending run is kept and
# the others are cancelled, so a burst of merges is checked once, not once per
# merge. GitHub normally keeps the newest but does not guarantee the order:
# the merge queue's main check skips cancelled runs and re-runs main's latest
# run when it was cancelled and nothing is pending, so the tip is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which kind of change this is (issue #1300). A pull request whose every
  # changed path is documentation (scripts/ci-docs-only.sh) gets the text
  # checks of the check job and nothing else; every other job is skipped,
  # which satisfies branch protection. A push to main always runs everything.
  # The classifier is taken from main's side of the merge, never from the
  # pull request, so a pull request cannot rewrite it to skip its own
  # checks; one that adds or changes the script runs everything. If this job
  # fails, the run shows it red (so the merge queue waits for a person) and
  # every other job runs in full.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2 # the merge commit and both its parents

      - name: classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null &&
             git cat-file -e HEAD^1:scripts/ci-docs-only.sh 2>/dev/null &&
             git diff --quiet HEAD^1 HEAD -- scripts/ci-docs-only.sh; then
            git show HEAD^1:scripts/ci-docs-only.sh > "$RUNNER_TEMP/ci-docs-only.sh"
            if [ "$(git diff --name-status --no-renames HEAD^1 HEAD | bash "$RUNNER_TEMP/ci-docs-only.sh")" = true ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code (false: docs only, light run)"

  # The repository checks, as parallel jobs on GitHub-hosted runners (#1318).
  # They used to be one job on the self-hosted runners (#1286), which the
  # hosted runner ran out of disk for: the Rust jobs now free the runner's
  # unused tool trees first and build with line tables instead of full debug
  # info. check, at the end, is the one branch protection requires: it runs
  # the text checks itself and passes only when every job it needs passed.
  # Docs-only pull requests (#1300) skip every job but changes and check.
  #
  # The Rust-heavy jobs (rust here, voice-check below) can go back to the
  # self-hosted runners without a code change: set the repository variable
  # HEAVY_RUNNER to "local". A fork's pull request never reaches them.
  go:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # schema-compat diffs against the merge base

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files -co --exclude-standard '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      # .golangci-lint-version is the one place the linter version is named;
      # `make lint` and the pre-commit hook refuse to run any other. The
      # release it names must be built with a Go >= the go directive in
      # go.mod (1.25). golangci-lint-action@v8 has no version-file input, so
      # the file is read here.
      - name: golangci-lint version
        id: lint-version
        run: |
          v=$(tr -d '[:space:]' < .golangci-lint-version)
          echo "version=v${v#v}" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ steps.lint-version.outputs.version }}
          # Off: `config verify` downloads a JSON schema, and the job failed
          # when that download failed (#143). This step still fails on an
          # unknown linter or config version, but not on a misspelled key:
          # run `golangci-lint config verify` after editing .golangci.yml.
          verify: false

      - name: schema compatibility
        env:
          SCHEMA_COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/schema-compat.sh

      # The web client's wire types are generated from pkg/schema (#348): this
      # fails when web/src/schema/generated*.ts differ from what
      # `go generate ./pkg/schema` writes. Go only. The script's own test
      # runs first. The Android spike's copy of them must match too (#1719).
      - name: generated TypeScript wire types
        run: |
          ./scripts/schema-ts-check-test.sh
          ./scripts/schema-ts-check.sh
          ./scripts/spike-schema-check-test.sh
          ./scripts/spike-schema-check.sh

      # The emoji catalog (#953): the vendored third_party/unicode/emoji-test.txt
      # matches its pinned hash and scripts/emoji-update.sh refuses a mismatch.
      # Drift of the generated catalog fails in go test (cmd/emoji-gen).
      - name: emoji catalog
        run: ./scripts/emoji-update-test.sh

      - name: dependency gate
        run: ./scripts/depgate.sh

      # The deployment files in ops/deploy (#435): shellcheck, systemd-analyze
      # verify, and the backup, restore, upgrade and rollback scripts against
      # a real conchd. sqlite3 and shellcheck are host prerequisites of those
      # scripts; the image has systemd-analyze, and with CI set the test fails
      # rather than skips when one is missing.
      - name: deployment script packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3 shellcheck

      - name: deployment scripts
        run: ./scripts/deploy-scripts-test.sh

  # go test -race for internal/server, in five jobs. On a hosted runner the
  # package alone took 12 minutes and store 5.5, so one job was the run's
  # longest by ten minutes (#471, #1318). Shards 1 to 4 split the package's
  # tests by the letter after "Test" (about 1150 tests, counted 2026-11-05);
  # shard 4 also takes any test whose name continues with something other
  # than a capital letter, so a test can't fall between the shards. Shard 5
  # is the subpackages (store, approvals, hub, livekit, names). The package
  # has no fuzz targets or examples, which -run '^Test' would leave out.
  go-test-server:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: go-test-server (${{ matrix.shard }}/5)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, run: "^Test[A-E]" }
          - { shard: 2, run: "^Test[F-M]" }
          - { shard: 3, run: "^Test[N-S]" }
          - { shard: 4, run: "^Test([T-Z]|[^A-Z])" }
          - { shard: 5, run: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The pattern comes in through the environment, never through the
      # shell's parsing: shard 4's "(" and "|" are regexp, not shell.
      - name: go test (internal/server, shard ${{ matrix.shard }})
        env:
          RUN: ${{ matrix.run }}
        run: |
          if [ -z "$RUN" ]; then
            # The package's examples and fuzz targets would match no shard's
            # "^Test" pattern: fail here so one gets added when the first
            # lands, rather than leave it unrun.
            if go test -list '^(Example|Fuzz)' ./internal/server | grep -E '^(Example|Fuzz)'; then
              echo "internal/server has examples or fuzz targets: give them a shard"; exit 1
            fi
            pkgs=$(go list ./internal/server/... | grep -v '/internal/server$')
            [ -n "$pkgs" ] || { echo "no internal/server subpackages listed"; exit 1; }
            go test -race -timeout 25m $pkgs
          else
            go test -race -timeout 25m ./internal/server -run "$RUN"
          fi

  go-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test (everything but internal/server)
        run: |
          pkgs=$(go list ./... | grep -v -e '/internal/server$' -e '/internal/server/')
          [ -n "$pkgs" ] || { echo "no packages listed"; exit 1; }
          go test -race -timeout 25m $pkgs

  # The Rust voice client under voice/ (ADR-006), and the desktop
  # voice-helper integration, which drives the conch-voice this job builds.
  rust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ vars.HEAVY_RUNNER == 'local' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","conch-4tb"]') || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      # Line tables, not full debug info: the build directory is a few GB
      # instead of about 7, which is what filled the hosted runner's disk
      # (#1286, #1318). Panics still name file and line. Local builds keep
      # the profile voice/Cargo.toml gives them.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      # The hosted image ships tool trees no job here uses (.NET, Android,
      # GHC, CodeQL, cached Docker images): about 20 GB. On the image that had
      # about 14 GB free they had to go (#1286, #1318). Today's has about 88
      # GB free and this job uses about 11, while removing them takes 3½
      # minutes (#1352), so they go only when less than 30 GB is free.
      - name: free disk
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -n1 | tr -dc 0-9)
          if [ "$avail" -ge 30 ]; then echo "free disk: ${avail} GB free, nothing removed"; exit 0; fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The runner image names the apt cache below: its .debs are the image
      # release's packages. Runner environment variables, so not in `env`.
      - name: runner image
        id: image
        if: runner.environment == 'github-hosted'
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      # The toolchain script fetches one pinned clang, cargo-deny and
      # libwebrtc and verifies each against the SHA-256 in
      # scripts/voice-pins.sh, which is therefore the cache key. rustup, on
      # the runner, installs the Rust version voice/rust-toolchain.toml names.
      - name: rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/conch/llvm-*
            ~/.cache/conch/cargo-deny-*
            ~/.cache/conch/webrtc-*
          key: voice-toolchain-${{ runner.os }}-${{ hashFiles('scripts/voice-pins.sh') }}

      # -lt: built with line tables (above), so never mixed with a cache of
      # full-debug builds.
      - name: rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            voice/target
          key: voice-build-lt-${{ runner.os }}-${{ hashFiles('voice/Cargo.lock', 'voice/rust-toolchain.toml', 'scripts/voice-pins.sh') }}
          # After a dependency change, start from the last build instead of
          # from nothing; cargo rebuilds only what changed.
          restore-keys: |
            voice-build-lt-${{ runner.os }}-

      # The .debs of the system packages, kept so a run downloads only the
      # package indexes and not 40 MB from a mirror that can stall (13
      # minutes once, #1352). Keyed on the script, which holds the package
      # list, and on the image; a new image version starts from the last
      # one's .debs and fetches only what changed.
      - name: rust system packages cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/conch-apt
          key: voice-apt-${{ runner.os }}-${{ hashFiles('scripts/ci-voice-apt.sh') }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}
          restore-keys: |
            voice-apt-${{ runner.os }}-${{ hashFiles('scripts/ci-voice-apt.sh') }}-${{ steps.image.outputs.os }}-

      # The SDK's build needs GLib's headers (found through pkg-config). So does
      # dmn-audio's: the PipeWire headers (also found through pkg-config) and
      # libclang, which generates the Rust bindings to them. Nothing else comes
      # from the system. scripts/voice-env.sh says so if any is missing. The
      # script installs from the cache above and bounds every download.
      - name: rust system packages
        if: runner.environment == 'github-hosted'
        run: ./scripts/ci-voice-apt.sh ~/.cache/conch-apt

      # The self-hosted runner installs nothing (it has no sudo): it has
      # these, and this step says so when one is missing.
      - name: host prerequisites (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          missing=""
          for t in pkg-config; do command -v "$t" >/dev/null || missing="$missing $t"; done
          for p in glib-2.0 libpipewire-0.3; do pkg-config --exists "$p" || missing="$missing $p"; done
          ls /usr/lib/llvm-*/lib/libclang.so >/dev/null 2>&1 || missing="$missing libclang"
          if [ -n "$missing" ]; then echo "the self-hosted runner lacks:$missing"; exit 1; fi

      - name: rust toolchain
        run: ./scripts/voice-toolchain.sh

      - name: rust check
        run: make rust-check

      # desktop/.nvmrc names the same Node as web/.nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The voice supervisor against the real conch-voice (#948): the binary
      # rust check's cargo test built, a stub conchd on loopback, no audio.
      - name: desktop voice-helper integration
        run: CONCH_VOICE_BIN="$PWD/voice/target/debug/conch-voice" make desktop-voice-it

      - name: disk after the build
        if: always()
        run: df -h / && du -sh voice/target 2>/dev/null || true

  # The Rust voice client's Windows build (#890, docs/design/windows-desktop.md
  # section 1): x86_64-pc-windows-msvc on a hosted runner, with the pinned
  # libwebrtc win-x64 build verified by scripts/voice-toolchain.sh. MSVC and the
  # Windows SDK are on the runner image; cc-rs finds them through vswhere, so no
  # Action installs them. Hosted only: there is no self-hosted Windows runner.
  # Advisory for now, like voice-check and desktop-smoke: the required check
  # job does not wait on it, so read its result before a merge (it becomes
  # required once #1309 builds conch-voice here).
  voice-windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Line tables, not full debug info, as the rust job builds.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      # Keyed on the pins file, as the Linux job's cache is. Windows' own key
      # (runner.os) keeps the two apart. Only the downloaded zip is kept, and
      # voice-toolchain.sh hashes it against its pin on every run before
      # unpacking it, so a cached tree is never linked unread.
      - name: rust toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/conch/webrtc-*/webrtc-win-x64-release.zip
          key: voice-toolchain-zip-${{ runner.os }}-${{ hashFiles('scripts/voice-pins.sh') }}

      - name: rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            voice/target
          key: voice-build-lt-${{ runner.os }}-${{ hashFiles('voice/Cargo.lock', 'voice/rust-toolchain.toml', 'scripts/voice-pins.sh') }}
          restore-keys: |
            voice-build-lt-${{ runner.os }}-

      - name: rust toolchain
        run: ./scripts/voice-toolchain.sh

      # E1 (design section 1): what the runner has, recorded in the log.
      - name: msvc and windows sdk on the runner
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          "$vswhere" -latest -products '*' -property installationVersion
          "$vswhere" -latest -products '*' -property installationPath
          ls "/c/Program Files (x86)/Windows Kits/10/Include" || true
          rustc -Vv

      # The SDK's C++ glue against the verified libwebrtc: the part this job
      # exists to prove. -vv records the compiler it runs (E1). Not gated by
      # #1309: it does not reach conch-voice's own source.
      - name: build webrtc-sys (E1)
        run: |
          . scripts/voice-pins.sh
          # The verified tree must be there: without it webrtc-sys downloads
          # its own copy unchecked (as voice-env.sh refuses on Linux).
          webrtc="$(cygpath -m "$HOME/.cache/conch/$CONCH_WEBRTC_TAG/win-x64-release")"
          test -f "$webrtc/webrtc.ninja"
          export LK_CUSTOM_WEBRTC="$webrtc"
          cd voice
          # cc-rs prints each compiler command it runs when asked to.
          export CC_ENABLE_DEBUG_OUTPUT=1
          # The build's own status decides the step. The grep only shows the
          # compiler lines (and may match nothing), so it can never hide a
          # failed build: with "|| true" after a pipe, PIPESTATUS would be
          # true's, and the step would pass.
          status=0
          cargo build --locked -vv -p webrtc-sys > "$RUNNER_TEMP/webrtc-sys.log" 2>&1 || status=$?
          grep -E "^\[webrtc-sys [0-9.]+\] (running|OPT_LEVEL|CXX|CC|compiler)|Compiling webrtc-sys|Finished|^error" "$RUNNER_TEMP/webrtc-sys.log" | cut -c1-400 || true
          if [ "$status" -ne 0 ]; then tail -n 80 "$RUNNER_TEMP/webrtc-sys.log"; fi
          exit "$status"

      # The workspace without conch-voice, which does not build on Windows
      # until the Unix-only code is split out (#1309): its build waits on
      # that issue, and this is the one place it is left out.
      - name: cargo build, test and clippy (workspace except conch-voice, until #1309)
        run: |
          . scripts/voice-pins.sh
          # The verified tree must be there: without it webrtc-sys downloads
          # its own copy unchecked (as voice-env.sh refuses on Linux).
          webrtc="$(cygpath -m "$HOME/.cache/conch/$CONCH_WEBRTC_TAG/win-x64-release")"
          test -f "$webrtc/webrtc.ninja"
          export LK_CUSTOM_WEBRTC="$webrtc"
          cd voice
          cargo build --locked --workspace --exclude conch-voice
          cargo test --locked --no-fail-fast --workspace --exclude conch-voice
          cargo clippy --locked --workspace --exclude conch-voice --all-targets -- -D warnings

  # The web client under web/ (ADR-007). setup-node installs exactly the
  # Node web/.nvmrc pins and caches npm's download cache by the lockfile.
  # web-check installs with npm ci only, and downloads no browser.
  web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web check
        run: make web-check

  # The desktop shell under desktop/ (#940): the fetch script's test, the
  # repository rules, the dependency and licence gates, then npm ci,
  # typecheck, lint and unit tests. It downloads no Electron binary and
  # needs no display; the packaged app is the desktop-smoke job's.
  desktop:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: desktop check
        run: make desktop-check

  # The required status check. It runs the text checks every pull request
  # gets, docs-only ones included, then passes only if every job above that
  # should have run succeeded: skipped is accepted only for a docs-only
  # change (changes said code=false). It runs even when one of them failed,
  # so the failure is reported here rather than as a skipped check. changes
  # itself is not judged: if it fails, code is unset and every job runs in
  # full, so a pass here still means every check ran and passed.
  check:
    needs: [changes, go, go-test-server, go-test, rust, web, desktop]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No tracked text file may hold a bidi control, a line or paragraph
      # separator, or a control character other than tab, LF and CR (#244).
      # The script's own test runs first.
      - name: invisible characters
        run: |
          ./scripts/invisible-chars-test.sh
          ./scripts/invisible-chars.sh
          ./scripts/ci-docs-only-test.sh

      # The issue-claim helper's lifecycle (#831): real local Git remotes,
      # mocked GitHub and model calls, no network.
      - name: agent claims
        run: make agent-claim-test

      - name: every check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.code == 'false' }}
        run: |
          bad=$(jq -r --arg docs "$DOCS_ONLY" 'to_entries[] | select(.key != "changes")
            | select(.value.result != "success" and ($docs != "true" or .value.result != "skipped"))
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then echo "not every check passed:"; echo "$bad"; exit 1; fi
          echo "every check passed (docs only: $DOCS_ONLY)"

  desktop-smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The packaged desktop shell (#940): make desktop-build fetches the pinned
    # Electron (scripts/desktop-electron.sh checks its SHA-256 twice), builds
    # the web client for it and packs the unpacked Linux app with its fuses;
    # the smoke test then starts that app under a virtual display and drives it
    # over Chromium's remote-debugging port (desktop/tests/smoke/launch.ts says
    # why not Playwright's Electron launcher). It prints the app's
    # process.versions into this log. A job of its own: it needs a display and
    # a 100 MB download, and `make check` needs neither.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The REST smoke test (#942) builds a disposable conchd from this checkout.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      # The unpacked Electron, keyed by the pin file that names its version
      # and hash. Without a hit the build downloads it and checks it.
      - name: electron cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/conch/electron
          key: desktop-electron-${{ runner.os }}-${{ hashFiles('scripts/desktop-pins.sh') }}

      - name: virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # The browser build must not change because the desktop shell exists:
      # web/dist is hashed before and after the desktop build, and holds no
      # desktop code.
      - name: browser build before
        run: |
          make web-build
          ./scripts/desktop-web-dist-check.sh
          (cd web/dist && find . -type f | LC_ALL=C sort | xargs sha256sum) > "$RUNNER_TEMP/web-dist.before"

      - name: build the unpacked app
        run: make desktop-build

      # The feeds smoke test (#943) puts a browser user, in the Chromium that
      # Playwright's own version pins, beside the app on the same conchd,
      # which serves the web/dist built above at /app/.
      - name: browser for the second client
        working-directory: desktop
        run: npx playwright install --with-deps chromium

      - name: browser build after
        run: |
          (cd web/dist && find . -type f | LC_ALL=C sort | xargs sha256sum) > "$RUNNER_TEMP/web-dist.after"
          diff "$RUNNER_TEMP/web-dist.before" "$RUNNER_TEMP/web-dist.after"

      # The Chromium sandbox stays on. This runner's kernel may restrict
      # unprivileged user namespaces (Ubuntu 24.04's AppArmor), which the
      # sandbox's namespace mode needs; the setuid helper is the other mode,
      # and it is what the .deb package installs (#774). Here it is made so on
      # the throwaway runner. Not verified before this job's first CI run: if
      # the sandbox will not start, this step is where to look.
      - name: sandbox helper
        run: |
          sudo chown root:root desktop/dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 desktop/dist/linux-unpacked/chrome-sandbox

      - name: smoke test
        run: xvfb-run -a make desktop-smoke

  web-embedded:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The web client built into conchd (issue #347): make build-web-embedded
    # builds bin/conchd with -tags conchweb, and this job starts it with no
    # --web-dir and checks what an operator who downloaded a release binary
    # gets: /app/ with the security headers and no-store on the index, a
    # hashed asset as immutable, `conchd version` saying so, and --no-web
    # turning it off. The untagged build is what the go and go-test jobs test.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build
        run: make build-web-embedded

      - name: version says embedded
        run: |
          bin/conchd version | tee /dev/stderr | grep -qx 'web: embedded'

      - name: serve /app/ from the binary
        run: |
          set -eu
          data=$(mktemp -d)
          log=$(mktemp)
          bin/conchd serve --data "$data" --listen 127.0.0.1:0 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          addr=""
          for _ in $(seq 1 50); do
            addr=$(sed -n 's/^conchd .* listening on \(127\.0\.0\.1:[0-9]*\) .*/\1/p' "$log")
            [ -n "$addr" ] && break
            sleep 0.2
          done
          [ -n "$addr" ] || { echo "conchd did not start"; cat "$log"; exit 1; }
          grep -qx 'conchd web: embedded' "$log"

          # headers <path> <status>: writes the response headers to $hdr.
          hdr=$(mktemp)
          check() { # path want-status header-regex...
            path=$1; want=$2; shift 2
            got=$(curl -s -o /dev/null -D "$hdr" -w '%{http_code}' "http://$addr$path")
            [ "$got" = "$want" ] || { echo "GET $path = $got, want $want"; exit 1; }
            for re in "$@"; do
              grep -iq "$re" "$hdr" || { echo "GET $path: no header matching $re"; cat "$hdr"; exit 1; }
            done
          }
          check /app/ 200 \
            "^content-security-policy: default-src 'self'" \
            '^cache-control: no-store' \
            '^x-content-type-options: nosniff' \
            '^referrer-policy: no-referrer'
          asset=$(ls internal/web/dist/assets | head -n 1)
          [ -n "$asset" ] || { echo "the build has no hashed asset"; exit 1; }
          check "/app/assets/$asset" 200 '^cache-control: public, max-age=31536000, immutable'
          check /app/assets/missing.js 404
          check / 302 '^location: /app/'

      - name: --no-web turns it off
        run: |
          set -eu
          data=$(mktemp -d)
          log=$(mktemp)
          bin/conchd serve --no-web --data "$data" --listen 127.0.0.1:0 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          addr=""
          for _ in $(seq 1 50); do
            addr=$(sed -n 's/^conchd .* listening on \(127\.0\.0\.1:[0-9]*\) .*/\1/p' "$log")
            [ -n "$addr" ] && break
            sleep 0.2
          done
          [ -n "$addr" ] || { echo "conchd did not start"; cat "$log"; exit 1; }
          # Authentication is on, so a route that does not exist answers 401
          # (nothing is exempt); what matters is that it is not 200 or 302.
          for p in /app/ /; do
            got=$(curl -s -o /dev/null -w '%{http_code}' "http://$addr$p")
            case "$got" in 200|301|302) echo "GET $p = $got with --no-web"; exit 1;; esac
          done

  rust-advisories:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Known advisories against the crates conch-voice links (RustSec). A job of
    # its own and not part of check: it reads a database on the network, and a
    # new advisory turns it red with no change here. Red means look at it, and
    # either update the crate or record why not in voice/deny.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: advisories
        run: ./scripts/voice-advisories.sh

  web-advisories:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Known advisories (high or critical) against the packages web/dist ships:
    # the runtime dependencies, so development tools are left out. A job of
    # its own and not part of check, as rust-advisories is: it reads the npm
    # registry's database, and a new advisory turns it red with no change
    # here. Red means look at it, and update the package or say why not.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - name: advisories
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  dogfood-check:
    # The P1 release canary (ROADMAP success criterion,
    # .claude/skills/dogfood-check/): runs on every push to main and on any
    # PR labeled approval-path, per issue #19's acceptance criteria; the
    # release workflow (release.yml) runs it again on every tag. A release
    # does not ship, and an approval-path PR does not merge, on a failing
    # dogfood-check.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'approval-path')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: dogfood-check
        run: go run ./e2e/dogfood

  nets-check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The V2 exit proof (issue #121): the 2x4 squad layout through real
    # conchd/conch binaries, asserting the exact set of message ids every
    # participant sees on each message read path the server has (MCP
    # read_channel; the REST v2, v1 and v0 lists; the v2, v1 and v0
    # WebSockets; conch tail). Unlike dogfood-check it runs on every pull
    # request and every push to main, because any server change can open a
    # read path that leaks a scoped message. A new read path must be added to
    # the program: it cannot find one it does not know about.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: nets-check
        run: go run ./e2e/nets

  conch-bot-check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # conch-adapter against a real conchd, answering with the fixture
    # e2e/p3-local/fixtures/echo.sh (never a model): the reply loop in every
    # audience, the adapter's session and one run per reply seen through the
    # API, a clean stop that ends the session and releases the lock, and the old
    # name conch-bot still starting with one deprecation line. It runs on every
    # pull request and every push to main: the adapter and the session, run and
    # intervention tools it calls move together.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: conch-bot-check
        run: go run ./e2e/conch-bot

  p2-hardening-check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The P2 exit gate (issue #81): a database written by a P1 conchd is
    # upgraded, and real conchd/conch binaries are driven through everything
    # P2 added on it: credentials, manifests and their refusals, rate limits,
    # the approval chain with ntfy up and down, the channel list (in the real
    # TUI too), audit export, search, files, threads and the principal-review
    # post. It ends by running e2e/dogfood itself and by checking it left
    # nothing behind. Like nets-check it runs on every pull request and every
    # push to main: what it guards is spread over the whole server and both
    # clients, so there is no set of paths or labels that could safely skip it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: p2-hardening-check
        run: go run ./e2e/p2-hardening

  p3-local-check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The automated P3 suite (issues #283 and #284): builds conchd, conch and
    # conch-adapter and the web client, starts a disposable conchd with
    # --session-stale 2s --session-offline 5s, creates the test community and
    # reads it back through the API, checks that each participant can connect
    # and send, and then runs the thirteen rows of the brief's test table
    # (P3-01 to P3-13): two terminal clients on pseudo-terminals, the
    # scripted agents as real conch-adapter processes, and the API only to
    # look and to see the requests no client makes refused. It tears
    # everything down and fails if anything is left behind. Without --keep,
    # so nothing outlives the job; P3-13 runs only with --real-adapter and the
    # claude program on PATH, which this job has neither of, and is reported
    # as not run. It runs on every pull request and every push to main, and
    # release.yml runs it before it builds. Its own tests (reset, interrupts,
    # the HOME sentinel, the walkthrough's commands, the screen the terminal
    # driver reads) run in the go-test jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Labels the LiveKit container of the browser voice spec, so the clean-up
      # step below removes only this run's.
      VOICE_CHECK_RUN: web-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: p3-local
        run: go run ./e2e/p3-local

      # The same suite again with conchd bound to the runner's own private
      # IPv4 (eth0) and every client given that address, to catch an address
      # assumption in the server, the runner or the clients (issue #382). It
      # proves addressing, not another machine. The run refuses to start where
      # there is no such address, and never falls back to loopback.
      - name: p3-local, non-loopback
        run: go run ./e2e/p3-local --non-loopback

  web-e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The browser suite (issue #285, D7): the web client in Chromium, against
    # the fixture community of e2e/p3-local (started with --keep and a
    # temporary root by the suite's own global setup, removed by its teardown,
    # which runs when a test fails too). Browser voice (issue #442) also runs
    # here: the spec starts the pinned LiveKit image in Docker, which the
    # runner has, on Chromium's fake microphone; with CI set it fails, not
    # skips, if Docker is missing. Playwright is pinned in
    # web/package.json and installs the Chromium that version needs. A job of
    # its own and not part of check, which needs no browser. It runs on every
    # pull request and every push to main. Scripted agents only: the claude
    # program is neither on this runner nor ever run. The suite takes 17-19
    # minutes on main with the camera specs (44-46), so the bound is 30, not
    # 20: a bound the passing suite runs into cancels a green run (#1268).
    # On GitHub-hosted runners (#1305): it moved to the self-hosted ones for
    # speed only (#1288), and there it competed with check and with local
    # work for one machine's CPU. check stays self-hosted for its build cache.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Three jobs, each with its own conchd, fixture community and LiveKit, each
    # running a third of the spec files one at a time (#1290, #1305): 250 tests
    # took 17-19 minutes in one.
    name: web-e2e (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Labels this shard's LiveKit container, so the clean-up step below
      # removes only its own (web/e2e/voice-world.ts reads it).
      VOICE_CHECK_RUN: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci --no-audit

      # --with-deps installs the system libraries Chromium needs, with sudo,
      # which the runner has. Locally, `npx playwright install chromium` alone.
      - name: browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: web-e2e
        # --grep-invert @heavy (#1613): a test tagged @heavy runs only in the
        # heavy lane (e2e-heavy.yml, nightly and on demand), never here. See
        # docs/testing.md for the tags and the PR budget.
        run: make web-e2e E2E_ARGS="--shard=${{ matrix.shard }}/3 --grep-invert @heavy"

      # The spec removes its own container on every path; this is for the case
      # where the runner killed it. Only the container of this run.
      - name: remove any leftover LiveKit container
        if: always()
        run: docker ps -aq --filter "label=conch-web-voice=$VOICE_CHECK_RUN" | xargs -r docker rm -f

      # The traces hold this run's fixture credentials (Bearer headers, the
      # filled sign-in value). They are throwaway: `make web-e2e` runs the
      # global teardown, which stops the server and removes the root, before
      # this step, so by the time anyone downloads a trace they open nothing.
      - name: traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-test-results-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  voice-check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The V3 exit program (issue #129, ADR-004): a real conchd, the real conch
    # CLI and a real LiveKit server in Docker, plus the proof that the core is
    # unaffected with LiveKit down or not configured. From V4 (issue #188) it
    # also runs three real conch-voice clients against them, so the job builds
    # the Rust client first. It runs on every pull request and every push to
    # main, like check. CI=true makes a skip a failure: if Docker, the LiveKit
    # image, lk or the Rust toolchain cannot be had, this job is red rather
    # than quietly green.
    # On GitHub-hosted runners (#1318), or on the self-hosted ones for this
    # repository's own branches when the variable HEAVY_RUNNER is "local".
    runs-on: ${{ vars.HEAVY_RUNNER == 'local' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","conch-4tb"]') || 'ubuntu-latest' }}
    # About three times a warm run (5 to 9 minutes): room for a cold run
    # whose packages come slowly (#1352), still well short of half an hour.
    timeout-minutes: 25
    env:
      CI: "true"
      # Labels this run's LiveKit container, so the clean-up step below can
      # only ever remove its own.
      VOICE_CHECK_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      # As the rust job builds (#1318), so its cache serves this job.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      # The voice build cache would fill the hosted runner's disk with the
      # image's unused tool trees still on it (#1286, #1318), on the image
      # that had about 14 GB free. As in the rust job, they go only when less
      # than 30 GB is free: removing them takes 3½ minutes (#1352).
      - name: free disk
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -n1 | tr -dc 0-9)
          if [ "$avail" -ge 30 ]; then echo "free disk: ${avail} GB free, nothing removed"; exit 0; fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: runner image
        id: image
        if: runner.environment == 'github-hosted'
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      # The same pinned toolchain and build directory as the rust job, read
      # from its caches and never written from here: rust builds everything
      # this job needs (cargo test builds the conch-voice binary), so with a
      # warm cache the program's own `cargo build` has nothing left to do.
      - name: rust toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/conch/llvm-*
            ~/.cache/conch/cargo-deny-*
            ~/.cache/conch/webrtc-*
          key: voice-toolchain-${{ runner.os }}-${{ hashFiles('scripts/voice-pins.sh') }}

      - name: rust build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            voice/target
          key: voice-build-lt-${{ runner.os }}-${{ hashFiles('voice/Cargo.lock', 'voice/rust-toolchain.toml', 'scripts/voice-pins.sh') }}
          restore-keys: |
            voice-build-lt-${{ runner.os }}-

      # The same apt cache as the rust job's, which this job, unlike its two
      # caches above, writes as well as reads: the jobs run side by side, and this is where a stalled
      # mirror cost 13 minutes (#1352). Whichever finishes first saves it.
      - name: rust system packages cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/conch-apt
          key: voice-apt-${{ runner.os }}-${{ hashFiles('scripts/ci-voice-apt.sh') }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}
          restore-keys: |
            voice-apt-${{ runner.os }}-${{ hashFiles('scripts/ci-voice-apt.sh') }}-${{ steps.image.outputs.os }}-

      - name: rust system packages
        if: runner.environment == 'github-hosted'
        run: ./scripts/ci-voice-apt.sh ~/.cache/conch-apt

      - name: rust toolchain
        run: ./scripts/voice-toolchain.sh

      - name: voice-check
        run: go run ./e2e/voice

      # The program removes its own container on every path; this is for the
      # case where the runner killed it. Only the container of this run.
      - name: remove any leftover LiveKit container
        if: always()
        run: docker ps -aq --filter "label=conch-voice-check=$VOICE_CHECK_RUN" | xargs -r docker rm -f

