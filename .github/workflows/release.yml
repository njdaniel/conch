name: Release

# Only Nick pushes v* tags (releases are Tier-H, ADR-000), so the tag push
# is the release sign-off act. Procedure: .claude/skills/release/.
# Re-runs the full gate plus the three canaries, dogfood-check (P1),
# p2-hardening-check (P2) and p3-local-check (P3); a release does not ship
# when any fails. Builds both binaries, the Linux desktop .deb (issue #1598),
# and the unsigned Windows installer (issue #1991), both with the bundled
# voice helper. A plain tag (v1.2.3) creates a DRAFT
# release that Nick publishes; a tag with a pre-release suffix
# (v0.1.0-alpha.1) is published at once as a GitHub pre-release, since
# pushing that tag is itself Nick's sign-off for a test build.
#
# Five jobs, so that nothing is released unless everything built:
#   release      the gates and the Go binaries (unchanged), uploaded as an
#                artifact. It no longer writes checksums or the release.
#   desktop-deb  the guard (the tag is HEAD, the tree is clean, the helper's
#                version is the tag's), conch-voice with the pinned toolchain,
#                the .deb and its package test, uploaded as an artifact.
#   desktop-windows  the same guard, conch-voice.exe, and the unsigned preview
#                    installer, uploaded after checking the installed files.
#   attest       the only job with id-token and attestations: write. It
#                collects the three artifacts, writes the one checksums.txt over
#                all of them and attests every file (GitHub artifact
#                attestations). Before attesting it asserts the exact file
#                set: the six Go binaries, one .deb and the installer for the tag.
#   publish      verifies the attestation of every file, then creates the
#                release from them.
# A failure before publish creates no release. A release is never
# re-run: a re-run would build again under the same tag. Tag a new version.
#
# Verify a download the way the release notes say, which pins the workflow and
# the tag, so an attestation from another workflow or ref is refused:
#   gh attestation verify <file> --repo njdaniel/conch \
#     --signer-workflow njdaniel/conch/.github/workflows/release.yml \
#     --source-ref refs/tags/<tag>

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_preview_tag:
        description: 'Tag to stamp on the Windows dry-run build (v plus the workspace version in voice/Cargo.toml)'
        type: string
        required: true

# Least privilege: every job reads. Only publish writes contents, and only
# attest gets the two attestation write permissions (#1598); publish reads
# attestations, to verify them before it creates the release.
permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # cache: false, as in the desktop-deb job: a release is built from
      # nothing a cache could have supplied unverified (a poisoned cache from
      # another ref would otherwise reach the released binaries).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      # Same pinned linter and settings as ci.yml; see the comments there.
      - name: golangci-lint version
        id: lint-version
        run: |
          v=$(tr -d '[:space:]' < .golangci-lint-version)
          echo "version=v${v#v}" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v8.0.0
        with:
          version: ${{ steps.lint-version.outputs.version }}
          verify: false # network-dependent; see ci.yml

      - name: go test
        # internal/server alone takes 7–10 minutes under -race on a runner,
        # past go test's default 10-minute timeout per package (#471);
        # making it faster is #472.
        run: go test -race -timeout 25m ./...

      # schema-compat is a diff-based PR/main gate; a tag has no base to
      # diff against, and everything tagged already passed it pre-merge.

      - name: dependency gate
        run: ./scripts/depgate.sh

      - name: dogfood-check
        run: go run ./e2e/dogfood

      # The P2 exit gate. It runs e2e/dogfood itself as its last step; the
      # step above already has, so that is skipped here.
      - name: p2-hardening-check
        run: go run ./e2e/p2-hardening -skip-dogfood

      # The automated P3 suite (issue #284). It builds the web client, so it
      # needs the Node that web/.nvmrc pins, as the p3-local-check job in
      # ci.yml does. P3-13 runs the real Claude Code command only with
      # --real-adapter, which this step does not pass.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: p3-local-check
        run: go run ./e2e/p3-local

      # conchd embeds the web client (issue #347): the build goes to
      # internal/web/dist (the Node setup above is the pinned one) and every
      # conchd target is built with -tags conchweb. conch is unchanged.
      # What is embedded must pass the web gates first: the dependency
      # allow-list, exact versions and licences, with the client's lint and
      # tests (the Go side's depgate runs above).
      - name: web-check
        run: make web-check

      - name: Build the web client for embedding
        run: make web-embed

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -tags conchweb -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/conchd_${GITHUB_REF_NAME}_${target%/*}_${target#*/}" ./cmd/conchd
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/conch_${GITHUB_REF_NAME}_${target%/*}_${target#*/}" ./cmd/conch
          done

      # The attest job writes one checksums file covering the binaries and
      # both desktop installers. This job hands over the binaries only.
      - name: Keep the binaries for the later jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  desktop-deb:
    # The Linux desktop app's .deb with the bundled voice helper (#1598, D6-04
    # of #774; decisions Q-D6-4 and Q-D6-7 of #1595). It runs beside the
    # gates on the same tag, and publish waits for it: a missing helper, a
    # version that is not the tag's or a failed package test stops the release.
    #
    # ubuntu-24.04, not ubuntu-latest: dpkg-shlibdeps takes each Depends floor
    # from the build machine's libraries, and ubuntu-latest is now 26.04, whose
    # .deb asks for libc6 (>= 2.43) and so cannot be installed on 24.04, the
    # oldest system desktop-deb.sh supports (found by #1652's lifecycle run,
    # 43098834902). Build on the oldest supported release; the Go jobs are
    # static (CGO_ENABLED=0) and are unaffected.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The release's tag, as scripts/desktop-build.sh and desktop-deb.sh take
      # it: the app, the package and the helper must all say this version.
      CONCH_RELEASE_VERSION: ${{ github.ref_name }}
      DESKTOP_REQUIRE_VOICE: "1"
    steps:
      # Full history: the guard checks that the tagged commit is on main.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # First, so a bad tag fails in seconds and not after the Rust build:
      # the tag must be this commit, the tree clean, the commit on main, and
      # voice/Cargo.toml's version the tag's. (`git describe` needs the tag, which a tag-push
      # checkout fetches.)
      - name: guard the tag
        run: ./scripts/desktop-release-guard.sh "$GITHUB_REF_NAME"

      # As the rust job in ci.yml: the hosted image ships tool trees this job
      # does not use (about 20 GB), and the Rust build plus the desktop build
      # and the package take about 15 GB. They go only when less than 30 GB is
      # free: removing them takes 3½ minutes (#1352).
      - name: free disk
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -n1 | tr -dc 0-9)
          if [ "$avail" -ge 30 ]; then echo "free disk: ${avail} GB free, nothing removed"; exit 0; fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null 2>&1 || true
          df -h /

      # cache: false, as in the desktop-deb job: a release is built from
      # nothing a cache could have supplied unverified (a poisoned cache from
      # another ref would otherwise reach the released binaries).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: runner image
        id: image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: rust system packages cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/conch-apt
          key: voice-apt-${{ runner.os }}-${{ hashFiles('scripts/ci-voice-apt.sh') }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}
          restore-keys: |
            voice-apt-${{ runner.os }}-${{ hashFiles('scripts/ci-voice-apt.sh') }}-${{ steps.image.outputs.os }}-

      # GLib, PipeWire and libclang for the helper's build (ci.yml's rust job).
      - name: rust system packages
        run: ./scripts/ci-voice-apt.sh ~/.cache/conch-apt

      # The pinned clang and libwebrtc. There is deliberately no cache of
      # them here (ci.yml has one): a cache restored from another ref is not
      # hash-checked, so the release fetches them cold, and
      # scripts/voice-toolchain.sh verifies each download against the SHA-256
      # in scripts/voice-pins.sh. The release is built from a clean target
      # directory too: no build cache.
      - name: rust toolchain
        run: ./scripts/voice-toolchain.sh

      # dpkg-shlibdeps (dpkg-dev) computes the package's Depends;
      # desktop-file-validate (desktop-file-utils) is checked by the package
      # test when present. Both come from the runner's own apt sources.
      - name: packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev desktop-file-utils

      # desktop/.nvmrc is the desktop's Node; web/.nvmrc names the same one.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: electron cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/conch/electron
          key: desktop-electron-${{ runner.os }}-${{ hashFiles('scripts/desktop-pins.sh') }}

      # bin/conch-voice, built with --release --locked. Its version is
      # voice/Cargo.toml's, which the guard has made the tag's.
      - name: build conch-voice
        run: make rust-build

      # The app in release mode (the helper is required, and its --version
      # must be the tag's), the .deb, and scripts/desktop-deb-test.sh in full
      # mode on that package: make desktop-deb runs all three.
      - name: build the .deb
        run: make desktop-deb

      - name: disk after the build
        if: always()
        run: |
          df -h /
          du -sh voice/target 2>/dev/null || true

      - name: Keep the .deb for the later jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-deb
          path: desktop/dist/conch-desktop_*_amd64.deb
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    # The release guard and production manifest are the same as desktop-deb;
    # the helper, Electron and NSIS steps follow desktop-windows in ci.yml.
    # Dry run: dispatch Release on the branch to test with windows_preview_tag
    # set to v plus voice/Cargo.toml's workspace version. It exercises release
    # stamping and the install test, then uploads the desktop-windows artifact.
    # The dry run checks the workspace version before building. The guard's
    # Git checks, attestation and publication run only on tag pushes.
    if: github.event_name == 'push' || github.ref_type == 'branch'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CONCH_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.windows_preview_tag }}
    steps:
      # Full history for the same ancestry check as the Linux release guard.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        env:
          # Keep LF for Git Bash and the guard's Cargo.toml parser.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 0

      - name: guard the tag
        if: github.event_name == 'push'
        run: ./scripts/desktop-release-guard.sh "$GITHUB_REF_NAME"

      - name: validate dry-run tag
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/desktop-release-guard.sh --dry-run "$CONCH_RELEASE_VERSION"

      # Both web/ and desktop/ build with the desktop's pinned Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: desktop/.nvmrc

      - name: npm ci
        working-directory: desktop
        run: npm ci --no-audit

      # Fetch the pinned toolchain cold, as desktop-deb does. The toolchain
      # script verifies the archive before unpacking, and Cargo builds fresh.
      - name: rust toolchain
        run: ./scripts/voice-toolchain.sh

      # Build the same release helper as CI. The installed copy is run and
      # checked against the app version before the installer is uploaded.
      - name: build the voice helper (release)
        run: |
          . scripts/voice-pins.sh
          # The verified tree must be there: without it webrtc-sys downloads
          # its own copy unchecked (as voice-env.sh refuses on Linux).
          webrtc="$(cygpath -m "$HOME/.cache/conch/$CONCH_WEBRTC_TAG/win-x64-release")"
          test -f "$webrtc/webrtc.ninja"
          export LK_CUSTOM_WEBRTC="$webrtc"
          cd voice
          cargo build --locked --release -p conch-voice

      # The Windows Electron of the pinned version, for electronDist, so that
      # electron-builder downloads no Electron itself. It is kept only if its
      # SHA-256 equals the hash in desktop/node_modules/electron/checksums.json,
      # which npm ci verified against desktop/package-lock.json, the second of
      # the two hashes scripts/desktop-electron.sh checks on Linux.
      # scripts/desktop-pins.sh has no Windows hash: adding one is a pin change
      # (Nick's sign-off). Unpacked with Python's zipfile, as
      # voice-toolchain.sh unpacks libwebrtc here.
      - name: windows electron
        run: |
          . scripts/desktop-pins.sh
          have=$(node -p "require('./desktop/package.json').devDependencies.electron")
          if [ "$have" != "$CONCH_ELECTRON_VERSION" ]; then
            echo "desktop/package.json pins electron $have but scripts/desktop-pins.sh pins $CONCH_ELECTRON_VERSION"; exit 1
          fi
          archive="electron-v${CONCH_ELECTRON_VERSION}-win32-x64.zip"
          want=$(node -p "require('./desktop/node_modules/electron/checksums.json')['$archive'] || ''")
          if ! [[ "$want" =~ ^[0-9a-f]{64}$ ]]; then echo "checksums.json has no SHA-256 for $archive"; exit 1; fi
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/$archive" "https://github.com/electron/electron/releases/download/v${CONCH_ELECTRON_VERSION}/$archive"
          # From standard input: Git Bash's sha256sum prefixes the hash with a
          # backslash when the file name holds one, as $RUNNER_TEMP does.
          got=$(sha256sum < "$RUNNER_TEMP/$archive" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then echo "SHA-256 of $archive is $got, but checksums.json says $want; nothing was unpacked"; exit 1; fi
          rm -rf desktop/out/electron-dist-win
          py=python3
          command -v python3 >/dev/null 2>&1 || py=python
          "$py" -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$RUNNER_TEMP/$archive" desktop/out/electron-dist-win
          test -f desktop/out/electron-dist-win/electron.exe
          echo "Electron $CONCH_ELECTRON_VERSION (win32-x64, $got) unpacked into desktop/out/electron-dist-win"

      # Build web and desktop as in CI. CONCH_RELEASE_VERSION makes the
      # manifest use the tag plus compat-extra.json for the server list.
      # The same version goes into app metadata and the installed stamp.
      # MSYS_NO_PATHCONV preserves Vite's --base / under Git Bash.
      - name: build the installer
        id: installer
        run: |
          . scripts/desktop-pins.sh
          root=$(cygpath -m "$PWD")
          version=$(./scripts/desktop-version.sh app "$CONCH_RELEASE_VERSION")
          (cd web && npm ci --no-audit)
          (cd web && MSYS_NO_PATHCONV=1 ./node_modules/.bin/vite build --mode desktop --base / --outDir "$root/desktop/out/ui" --emptyOutDir)
          (cd desktop && npm run bundle && node build/manifest.ts)
          rm -rf desktop/out/win-resources desktop/dist
          mkdir -p desktop/out/win-resources
          cp voice/target/release/conch-voice.exe desktop/out/win-resources/conch-voice.exe
          printf '%s\n' "$version" >desktop/out/win-resources/version
          # CI=true keeps electron-builder from asking the registry for a
          # newer electron-builder; dist:win passes --publish never.
          (cd desktop && CI=true npm run dist:win -- \
            "-c.electronDist=$root/desktop/out/electron-dist-win" "-c.electronVersion=$CONCH_ELECTRON_VERSION" \
            "-c.extraMetadata.version=$version")
          setup="desktop/dist/Conch-$version-unsigned-preview-setup.exe"
          test -f "$setup"
          echo "installer: $setup (version $version)"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # NSIS /S installs per-user into %LOCALAPPDATA%\Programs\Conch, as in CI.
      - name: install and check the release package
        shell: pwsh
        working-directory: desktop
        env:
          APP_VERSION: ${{ steps.installer.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item -LiteralPath "dist/Conch-${env:APP_VERSION}-unsigned-preview-setup.exe"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($null -eq $p.ExitCode -or $p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }

          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Conch'
          $exe = Get-Item -LiteralPath (Join-Path $dir 'Conch.exe')
          $resources = Join-Path $dir 'resources'
          $asar = Join-Path $resources 'app.asar'
          $helper = Join-Path $resources 'conch-voice.exe'
          if ($exe.VersionInfo.FileVersion -ne $env:APP_VERSION) { throw "Conch.exe has version $($exe.VersionInfo.FileVersion)" }
          if (Test-Path -LiteralPath (Join-Path $resources 'default_app.asar')) { throw 'Electron default_app.asar was installed' }
          $stamp = (Get-Content -LiteralPath (Join-Path $resources 'version') -Raw).Trim()
          if ($stamp -ne $env:APP_VERSION) { throw "resources\version says '$stamp', expected '$env:APP_VERSION'" }
          $voiceVersion = & $helper --version
          if ($LASTEXITCODE -ne 0 -or $voiceVersion -cnotlike "conch-voice $env:APP_VERSION (*)") {
            throw "unexpected installed conch-voice.exe version '$voiceVersion' (exit $LASTEXITCODE)"
          }
          $contents = & node node_modules/@electron/asar/bin/asar.js list --is-pack $asar
          if ($LASTEXITCODE -ne 0) { throw "could not list app.asar (exit $LASTEXITCODE)" }
          if ($contents -cnotcontains 'pack   : \build\icons\48.png') { throw 'the Windows tray icon is missing from app.asar' }

          # Check the packaged metadata against the release inputs.
          node build/check-release-asar.ts $asar
          if ($LASTEXITCODE -ne 0) { throw "installed app version or compat list check failed (exit $LASTEXITCODE)" }

      - name: Keep the checked installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows
          path: desktop/dist/Conch-${{ steps.installer.outputs.version }}-unsigned-preview-setup.exe
          if-no-files-found: error
          retention-days: 7

  attest:
    # Collects every artifact, writes the one checksums.txt over all of them
    # and attests them (Q-D6-4). The only job with the two attestation
    # permissions; it needs nothing else but to read this run's artifacts.
    if: github.event_name == 'push'
    needs: [release, desktop-deb, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # gh run download, of this run's artifacts
      id-token: write # the signing identity of the attestation
      attestations: write # storing it
    steps:
      - name: collect the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name go-dist --dir dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name desktop-deb --dir dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name desktop-windows --dir dist
          # The exact set, before anything is checksummed or attested: the
          # six Go binaries named for this tag (the release job's matrix:
          # conchd and conch, each for linux/amd64, linux/arm64 and
          # darwin/arm64), one .deb, and the installer named for this tag.
          # find also lists directories and nested files, which are refused.
          debs=$(find dist -mindepth 1 -maxdepth 1 -type f -name 'conch-desktop_*_amd64.deb' -printf '%f\n')
          if [ "$(printf '%s\n' "$debs" | grep -c .)" != 1 ]; then
            echo "want exactly one .deb, have:"; echo "$debs"; find dist; exit 1
          fi
          want=$(
            {
              for bin in conchd conch; do
                for plat in linux_amd64 linux_arm64 darwin_arm64; do
                  echo "${bin}_${GITHUB_REF_NAME}_${plat}"
                done
              done
              echo "$debs"
              echo "Conch-${GITHUB_REF_NAME#v}-unsigned-preview-setup.exe"
            } | LC_ALL=C sort
          )
          have=$(find dist -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
          if [ "$have" != "$want" ]; then
            echo "dist is not exactly the expected files. want:"; echo "$want"
            echo "have:"; echo "$have"; exit 1
          fi
          if [ -n "$(find dist -mindepth 1 ! -type f)" ]; then echo "dist holds a non-file"; find dist; exit 1; fi
          # One checksums.txt, over the binaries and both installers, in the form
          # `sha256sum -c` takes from the directory the files are in.
          (cd dist && sha256sum -- * > ../checksums.txt && mv ../checksums.txt checksums.txt && sha256sum -c checksums.txt)
          cat dist/checksums.txt

      # A new Action (#1598; Nick signs it off in the PR): GitHub-owned,
      # pinned by full commit SHA. Verify a download as the header says: with
      # --signer-workflow and --source-ref, so only this workflow, run for the
      # tag, passes. `--repo` alone accepts any workflow on any ref.
      - name: attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Keep the release files for publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release
      actions: read # gh run download
      attestations: read # gh attestation verify fetches the attestations
    steps:
      - name: collect the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-files --dir dist
          (cd dist && sha256sum -c checksums.txt)
          # The converse of `sha256sum -c`: every file in dist, and nothing
          # but files, is listed in checksums.txt (which does not list itself).
          if [ -n "$(find dist -mindepth 1 ! -type f)" ]; then echo "dist holds a non-file"; find dist; exit 1; fi
          listed=$(sed 's/^[0-9a-f]* [ *]//' dist/checksums.txt)
          for f in dist/*; do
            name=${f#dist/}
            [ "$name" = checksums.txt ] && continue
            printf '%s\n' "$listed" | grep -qxF -- "$name" || { echo "$name is not listed in checksums.txt"; exit 1; }
          done

      # The release is created only from files whose attestation can be
      # retrieved and that this workflow signed for this tag.
      - name: verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in dist/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$GITHUB_REF_NAME"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot infer the repository from
          # a git remote: name it (v0.1.0-alpha.19's publish failed without it
          # and was published by hand from the run's attested files).
          GH_REPO: ${{ github.repository }}
        run: |
          checks="dogfood-check, p2-hardening-check and p3-local-check run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          web="The web client is served at /app/ by default (built into conchd; --web-dir serves a directory instead, --no-web turns it off)."
          deb="The Linux desktop app is conch-desktop_*_amd64.deb: a technical preview until real-device acceptance is recorded (#1603), not a supported release. Verify it with: sha256sum -c --ignore-missing checksums.txt, and gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/$GITHUB_REF_NAME."
          windows="The Windows x64 installer, Conch-${GITHUB_REF_NAME#v}-unsigned-preview-setup.exe, is an unsigned preview for testers. Windows SmartScreen may warn. [Verify the download and follow the Windows install steps]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/desktop/windows.md)."
          # A tag with a semver pre-release suffix (v0.1.0-alpha.1) is
          # published at once, marked a pre-release, with generated notes; a
          # plain tag stays a draft that Nick publishes.
          case "$GITHUB_REF_NAME" in
            *-*)
              gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
                --prerelease --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
                --notes "Pre-release. $checks

          $web

          $deb

          $windows"
              ;;
            *)
              gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
                --draft --verify-tag --title "$GITHUB_REF_NAME" \
                --notes "Draft — Nick publishes. $checks

          $web

          $deb

          $windows"
              ;;
          esac
