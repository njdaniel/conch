[package]
name = "conch-voice"
description = "The Conch voice client: push-to-talk voice for a channel, through LiveKit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Every crate and feature below was already in the tree through livekit or the three
# library crates, so Cargo.lock gains no crate. All are in deps-allowlist.txt.
[dependencies]
conch-voice-api = { path = "../crates/conch-voice-api" }
conch-voice-audio = { path = "../crates/conch-voice-audio" }
conch-voice-control = { path = "../crates/conch-voice-control" }
livekit = { workspace = true }
# The builder interface only: `derive` and `color` would each add crates to Cargo.lock.
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
# StreamExt, to read the SDK's stream of received audio frames.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
log = "0.4.34"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

# Linux only (issue #930): `dmn-audio` is PipeWire, and `pipewire-sys` does not build elsewhere.
# Moved here from `[dependencies]`; not a new dependency.
[target.'cfg(target_os = "linux")'.dependencies]
# The PipeWire microphone and speakers (ADR-006 as amended, issue #184). Its own public
# repository, by commit; the source is allowed by exact URL in deny.toml.
dmn-audio = { git = "https://github.com/njdaniel/dmn-audio", rev = "39e7748c0b4bf3317681f6718117152e48df63c8" }

# Windows only (issue #938): the named-pipe client the events endpoint opens, tokio's `net`
# feature. A feature of a crate already here (the dev-dependency below has it), so Cargo.lock
# gains no crate; Nick signed it off on #756, 2026-11-11.
[target.'cfg(windows)'.dependencies]
tokio = { version = "1.53", default-features = false, features = ["net"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows only (issue #1774, docs/design/windows-desktop.md section 2): the WASAPI microphone
# and speakers, as `dmn-audio` is PipeWire's. MIT, one maintainer, "the presented API is all
# safe Rust": the crate holds the native calls and every crate here still forbids them.
# Pinned exactly. Nick signed it off on #756, 2026-11-11.
wasapi = "=0.26.0"
# Windows only (issue #1781, docs/design/windows-desktop.md sections 4.3 and 4.4): Raw Input
# for the push-to-talk keys, in the background, through `winit`'s device events. Apache-2.0,
# pinned exactly and without its default features (no X11, no Wayland, no raw-window-handle,
# so only the Windows backend). The audit at this version is in the pull request and in the
# design note. Nick signed it off on #756, 2026-11-11.
winit = { version = "=0.30.13", default-features = false }

[dev-dependencies]
# The stub conchd the tests talk to is written by hand on tokio's listener.
tokio = { version = "1.53", default-features = false, features = ["io-util", "net"] }
# Without its default feature, as the rest of the tree has it.
tempfile = { version = "3.27", default-features = false }

[lints]
workspace = true
