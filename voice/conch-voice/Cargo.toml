[package]
name = "conch-voice"
description = "The Conch voice client: push-to-talk voice for a channel, through LiveKit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Every crate and feature below was already in the tree through livekit or the three
# library crates, so Cargo.lock gains no crate. All are in deps-allowlist.txt.
[dependencies]
conch-voice-api = { path = "../crates/conch-voice-api" }
conch-voice-audio = { path = "../crates/conch-voice-audio" }
conch-voice-control = { path = "../crates/conch-voice-control" }
livekit = { workspace = true }
# The PipeWire microphone and speakers (ADR-006 as amended, issue #184). Its own public
# repository, by commit; the source is allowed by exact URL in deny.toml.
dmn-audio = { git = "https://github.com/njdaniel/dmn-audio", rev = "39e7748c0b4bf3317681f6718117152e48df63c8" }
# The builder interface only: `derive` and `color` would each add crates to Cargo.lock.
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
# StreamExt, to read the SDK's stream of received audio frames.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
log = "0.4.34"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# The stub conchd the tests talk to is written by hand on tokio's listener.
tokio = { version = "1.53", default-features = false, features = ["io-util", "net"] }
# Without its default feature, as the rest of the tree has it.
tempfile = { version = "3.27", default-features = false }

[lints]
workspace = true
