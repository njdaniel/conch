# cargo-deny configuration for the voice/ workspace (ADR-006).
#
# The list of crates this workspace may depend on directly is
# deps-allowlist.txt, enforced by scripts/voice-depgate.sh: cargo-deny's own
# allow-list covers every crate in the graph, transitive ones included, so it
# cannot express "direct dependencies only". cargo-deny checks what a list of
# names cannot: where every crate comes from, its licence, and known
# advisories.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[sources]
# Every crate comes from crates.io, except dmn-audio (docs/design/conch-voice.md §9, ADR-006
# as amended), which comes from its own repository, by exact URL and pinned to a commit in
# voice/conch-voice/Cargo.toml. Any other git or other-registry source fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/njdaniel/dmn-audio"]

[licenses]
# This repository is AGPL-3.0. Everything linked into conch-voice must be
# compatible with distributing the result under it.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Apache-2.0 with LLVM's exception, which only adds permissions (it waives
    # two of Apache-2.0's conditions for compiled output). target-lexicon, a
    # build-time dependency of the PipeWire bindings, is under it; it is not
    # linked into conch-voice. Nick's sign-off, 2026-10-14 (issue #184).
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
multiple-versions = "allow"
# A version requirement of "*" is refused. The workspace's own crates depend on
# each other by path, which is not a wildcard in any sense that matters.
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
# Checked by a job of its own in CI (it needs the network and its result can
# change with no change here), not by `make check`.
# zip 0.6.6 reaches us only as a build-dependency of webrtc-sys-build 0.3.19
# (livekit -> libwebrtc -> webrtc-sys [build]), whose only use of it is
# download_webrtc(): extracting LiveKit's prebuilt archive when no libwebrtc
# is given. scripts/voice-env.sh, which every build here sources, always sets
# LK_CUSTOM_WEBRTC to the hash-checked library scripts/voice-pins.sh pins, so
# that path never runs (#480). Drop these when upstream moves to zip >= 9
# (#481).
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip extraction never runs: LK_CUSTOM_WEBRTC is always set (#480, drop with #481)" },
    { id = "RUSTSEC-2026-0368", reason = "zip extraction never runs: LK_CUSTOM_WEBRTC is always set (#480, drop with #481)" },
    { id = "RUSTSEC-2026-0369", reason = "zip extraction never runs: LK_CUSTOM_WEBRTC is always set (#480, drop with #481)" },
]
